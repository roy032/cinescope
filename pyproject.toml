[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinescope"
version = "0.10.0"
description = "An X-Ray engine for films, built from pixels up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jayanta Roy" }]
keywords = ["computer-vision", "film", "video-analysis", "shot-detection", "face-tracking", "clip"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
video = ["av>=12.0"]
cv = ["opencv-python>=4.9"]
dl = ["torch>=2.3", "torchvision>=0.18", "matplotlib>=3.8"]
app = ["fastapi", "uvicorn", "python-multipart", "onnx", "onnxruntime"]
dev = ["pytest>=8.0", "ruff==0.16.8", "scipy>=1.11", "matplotlib>=3.8", "httpx"]

[project.scripts]
cinescope = "cinescope.pipeline.__main__:main"
cinescope-preview = "cinescope.io.preview:main"
cinescope-doctor = "cinescope.doctor:main"

[project.urls]
Homepage = "https://github.com/roy032/cinescope"
Issues = "https://github.com/roy032/cinescope/issues"

[tool.setuptools.packages.find]
include = ["cinescope*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["kaggle/*.ipynb", "kaggle/jobs"]   # Kaggle glue: notebooks, and job bodies that run after _preamble.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
