[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinescope"
version = "0.1.0"
description = "An X-Ray engine for films, built from pixels up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
video = ["av>=12.0"]
cv = ["opencv-python>=4.9"]
dl = ["torch>=2.3", "torchvision>=0.18", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["cinescope*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
